name: Convert Assembled Resumes to PDF

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Convert to PDF
        run: |
          pandoc TPM-AI-Compliance/resume.md -o TPM-AI-Compliance/resume.pdf
          pandoc Staff-Data-Scientist/resume.md -o Staff-Data-Scientist/resume.pdf

      - name: Push changes
        env:
            TOKEN: ${{ secrets.GH_PAT }}        
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add TPM-AI-Compliance/resume.pdf Staff-Data-Scientist/resume.pdf
          git diff --cached --quiet || git commit -m "Rebuilt PDFs from existing Markdown"
          git push