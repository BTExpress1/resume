name: Assemble Modular Resumes

on: 
  workflow_dispatch:  # Manual trigger

jobs: 
  build-resumes: 
    runs-on: ubuntu-latest
        
    steps:
        - name: Checkout repo
          uses: actions/checkout@v3

        - name: Override remote with PAT
          env:
            TOKEN: ${{ secrets.GH_PAT }}
          run: git remote set-url origin https://x-access-token:${TOKEN}@github.com/BTExpress1/resume.git

        - name: Install Pandoc and LaTeX
          run: |
            sudo apt-get update
            sudo apt-get install -y pandoc texlive-xetex

        - name: Compute input checksum
          run: |
            find TPM-AI-Compliance/modules Staff-Data-Scientist/modules TPM-AI-Compliance/Dice/modules shared -name "*.md" | sort | xargs cat | sha256sum > input.checksum

        - name: Check for input changes
          run: |
            if git diff --quiet input.checksum; then
              echo "✅ Inputs unchanged — skipping assembly and PDF generation."
              exit 0
            else
              echo "🔄 Inputs changed — proceeding with assembly."
            fi

        # --- FULL ASSEMBLY (assemble.sh) ---

        - name: Make script executable (Full)
          run: chmod +x assemble.sh

        - name: Run assembly script (Full)
          run: |
            echo "Starting full assembly: ./assemble.sh"
            ./assemble.sh
            echo "Full assembly script execution finished."
            echo "✅ All resume.md assembled"
            echo "⏳ Pausing for 2 seconds to ensure file flush... $(date '+%Y-%m-%d %H:%M:%S')"
            sleep 2

        - name: Confirm working directory and file presence
          run: |
            echo "Current working directory:"
            pwd
            echo "Listing contents of TPM-AI-Compliance:"
            ls -l TPM-AI-Compliance

        - name: List files after assembly
          run: |
            echo "--- Listing all .md files ---"
            find . -name "*.md"

        - name: Debug and Verify Full TPM File Creation
          run: |
            FILE="TPM-AI-Compliance/resume.md"
            echo "--- Verifying FULL TPM output file creation ---"
            # Changed to $FILE for testing purposes
            if test -f "$FILE"; then
              echo "✅ SUCCESS: The file $FILE WAS created."
              ls -l "$FILE"
            else
              echo "❌ ERROR: The file $FILE WAS NOT found."
              exit 1
            fi
            echo "--------------------------------------"
        - name: Debug and Verify Full Dice File Creation
          run: |
            FILE="TPM-AI-Compliance/Dice/resume.md"
            echo "--- Verifying FULL Dice output file creation ---"
            # Changed to $FILE for testing purposes
            if test -f "$FILE"; then
              echo "✅ SUCCESS: The file $FILE WAS created."
              ls -l "$FILE"
            else
              echo "❌ ERROR: The file $FILE WAS NOT found."
              exit 1
            fi
            echo "--------------------------------------"
        - name: Debug and Verify Full DS File Creation
          run: |
            FILE="Staff-Data-Scientist/resume.md"
            echo "--- Verifying FULL DS output file creation ---"
            # Changed to $FILE for testing purposes
            if test -f "$FILE"; then
              echo "✅ SUCCESS: The file $FILE WAS created."
              ls -l "$FILE"
            else
              echo "❌ ERROR: The file $FILE WAS NOT found."
              exit 1
            fi
            echo "--------------------------------------"
        - name: Convert TPM resume (Full) to PDF
          run: pandoc TPM-AI-Compliance/resume.md -o TPM-AI-Compliance/resume.pdf
        - name: Convert TPM Dice resume (Full) to PDF
          run: pandoc TPM-AI-Compliance/Dice/resume.md -o TPM-AI-Compliance/Dice/resume.pdf

        - name: Convert DS resume (Full) to PDF
          run: pandoc Staff-Data-Scientist/resume.md -o Staff-Data-Scientist/resume.pdf

          # --- NO-SUMMARY ASSEMBLY (assemble-no-summary.sh) ---

        - name: Make no-summary script executable
          run: chmod +x assemble-no-summary.sh

        - name: Run no-summary assembly script
          run: |
            echo "Starting no-summary assembly script: ./assemble-no-summary.sh"
            ./assemble-no-summary.sh
            echo "No-summary assembly script execution finished."            
            echo "✅ All resume-no-summary.md assembled"
            echo "⏳ Pausing for 2 seconds to ensure file flush... $(date '+%Y-%m-%d %H:%M:%S')"
            sleep 2

        - name: Debug and Verify No-Summary TPM File Creation
          run: |
            FILE="TPM-AI-Compliance/resume-no-summary.md"
            echo "--- Verifying NO-SUMMARY TPM output file creation ---"
            # Changed to $FILE for testing purposes
            if test -f "$FILE"; then
              echo "✅ SUCCESS: The file $FILE WAS created by the script."
              ls -l "$FILE"
            else
              echo "❌ ERROR: The file $FILE WAS NOT found after the assembly script ran."
              echo "The assembly script likely failed silently or exited early. Check input file paths for case-sensitivity!"
              exit 1 # Fail the job here for clear visibility
            fi
            echo "--------------------------------------"
        - name: Debug and Verify No-Summary Dice File Creation
          run: |
            FILE="TPM-AI-Compliance/Dice/resume-no-summary.md"
            echo "--- Verifying NO-SUMMARY Dice output file creation ---"
            # Changed to $FILE for testing purposes
            if test -f "$FILE"; then
              echo "✅ SUCCESS: The file $FILE WAS created by the script."
              ls -l "$FILE"
            else
              echo "❌ ERROR: The file $FILE WAS NOT found after the assembly script ran."
              echo "The assembly script likely failed silently or exited early. Check input file paths for case-sensitivity!"
              exit 1 # Fail the job here for clear visibility
            fi
            echo "--------------------------------------"

        - name: Debug and Verify No-Summary DS File Creation
          run: |
            FILE="Staff-Data-Scientist/resume-no-summary.md"
            echo "--- Verifying NO-SUMMARY DS output file creation ---"
            # Changed to $FILE for testing purposes
            if test -f "$FILE"; then
              echo "✅ SUCCESS: The file $FILE WAS created by the script."
              ls -l "$FILE"
            else
              echo "❌ ERROR: The file $FILE WAS NOT found after the assembly script ran."
              echo "The assembly script likely failed silently or exited early. Check input file paths for case-sensitivity!"
              exit 1 # Fail the job here for clear visibility
            fi
            echo "--------------------------------------"


        - name: Convert TPM resume (no summary) to PDF
          run: pandoc TPM-AI-Compliance/resume-no-summary.md -o TPM-AI-Compliance/resume-no-summary.pdf
        - name: Convert TPM Dice resume (no summary) to PDF
          run: pandoc TPM-AI-Compliance/Dice/resume-no-summary.md -o TPM-AI-Compliance/Dice/resume-no-summary.pdf

        - name: Convert DS resume (no summary) to PDF
          run: pandoc Staff-Data-Scientist/resume-no-summary.md -o Staff-Data-Scientist/resume-no-summary.pdf

        - name: Push changes
          run: |
            git config user.name "Bini Teklehaimanot"
            git config user.email "padgenb@gmail.com"
            git add input.checksum TPM-AI-Compliance/resume.pdf TPM-AI-Compliance/resume-no-summary.pdf TPM-AI-Compliance/Dice/resume.pdf TPM-AI-Compliance/Dice/resume-no-summary.pdf Staff-Data-Scientist/resume.pdf Staff-Data-Scientist/resume-no-summary.pdf
            
            # Check if anything is staged
            if git diff --cached --quiet; then
              echo "✅ No changes staged — skipping commit and push."
              exit 0
            fi

          # Commit and push
          git commit -m "Rebuilt resumes from updated Markdown inputs and convert them to PDFs"
          git pull --rebase origin main
          git push